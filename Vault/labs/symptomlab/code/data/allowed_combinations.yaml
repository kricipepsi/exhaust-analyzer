  rough_idle_shudder:
    - constant_vibration_shudder
    - surging_hunting_idle
    - stalls_on_cold_start
  lack_of_power_hesitation:
    - flat_sluggish_always
    - hesitation_throttle_tip_in
    - sudden_jerk_stumble
  poor_economy_fuel_odor_sound:
    - just_poor_mpg
    - strong_fuel_smell
    - knock_pinging_under_load
  engine_dies_or_stalls:
    - when_coasting_to_stop
    - intermittent_random_cutout
    - backfire_loud_pop
  visible_exhaust_smoke:
    - black_smoke
    - blue_oily_smell
    - white_sweet_smell
  oil_consumption:
    - blue_smoke_on_cold_start_clears   # valve-stem seals: cold-start cloud that clears on driving (P_NEW_10)
    - blue_smoke_under_acceleration     # piston rings / turbo seal: worsens under load (P_NEW_09, P_NEW_13)
    - oil_loss_no_visible_smoke         # PCV stuck-open / slow consumption: oil loss without obvious smoke (P_NEW_11)
