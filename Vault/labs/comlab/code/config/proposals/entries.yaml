    - proposed_value: "TURBO_SEAL_OIL_LEAK"
      supersedes_pack_wording: "TURBO_SEAL_OIL_BURN"
      current_runtime_mapping: "POA_SIGNATURE"
      emittable_today: false
      gas_signature: "Extreme HC with stoichiometric lambda and near-zero CO; oil cracks in the hot exhaust rather than in-cylinder."
      comlab_action: "Future T-OIL-4 routes the POA turbo sub-mode plus forced-induction/perception gating to Engine Mechanical (Turbo Oil Seal)."
    - proposed_value: "HEAD_GASKET_OIL_BREACH"
      current_runtime_mapping: "COOLANT_LEAK_INTERNAL"
      emittable_today: false
      gas_signature: "False-lean O2 with suppressed NOx, elevated CO/HC, and oil/coolant emulsion evidence."
      comlab_action: "Future T-OIL-4 may refine head-gasket oil sub-mode routing; live GASLab emission remains COOLANT_LEAK_INTERNAL."

