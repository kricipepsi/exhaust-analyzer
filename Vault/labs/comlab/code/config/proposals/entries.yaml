- id: "COMLab-DELTA"
  family: "cross-lab-delta-proposal"
  consumer: "comlab/comlab/core/fault_atlas_router.py:FaultAtlasRouter.execute_triage_loop" # Reader: T-COMV2-DELTA-1D
  iso_sae_citation: "SAE J1635 / ISO 15031-6 §5.6 — two-speed-idle delta diagnosis"
  status: "proposed"
  owning_ledger: "COMLab T-COMV2-DELTA-1"
  source: "labs/obdlab/research/chunks/delta-relations/01-08; labs/comlab/research/PROPOSAL_DeltaLab_cross_lab_delta_module.md; SWEEP_MANIFEST §7 (FU-2)"
  description: >-
    Cross-lab two-operating-point delta as a proposal-bounded, default-off rank input.
    When a case carries an optional second operating-point frame, COMLab's stateless
    comlab/analytics/delta_engine.py:DeltaEngine.compute_delta_signature differences it
    against the primary (low-idle) channels and emits a typed delta_signature (ΔTrim /
    Δgas / ΔO₂). The signature is read by fault_atlas_router.execute_triage_loop Phase 5
    behind the default-off enable_delta constructor gate (DELTA-1D); absent frame →
    byte-identical single-point path. Per-signal bands are locked: ΔTrim @ STRESS_IDLE,
    Δgas/ΔO₂ @ REGULATORY_HIGH_IDLE, ABSTAIN on band mismatch; the air-metering /
    induction architecture gate runs first (MAP-only nulls ΔTrim, forced induction
    inverts its sign). Closes the long-open OBDLab FU-2 consumer named throughout
    delta-relations/*. The v2-registry path activation is the sibling follow-up
    T-COMV2-DELTA-2 (proposal COMLab-DELTA-V2).
  field:
    path: "OrchestratorInboundRequest.second_operating_point"
    disposition: "additive-optional (default None)"
    producer: "labs/comlab/comlab/schemas/ingestion.py:SecondOperatingPointFrame"
    consumer_path: "comlab/analytics/delta_engine.py:DeltaEngine.compute_delta_signature -> fault_atlas_router.py Phase 5 (T-COMV2-DELTA-1D)"

- id: "COMLab-DELTA-V2"
  family: "cross-lab-delta-proposal"
  consumer: "comlab/comlab/core/fault_atlas_router.py:FaultAtlasRouter.route" # Reader: T-COMV2-DELTA-2
  iso_sae_citation: "SAE J1635 / ISO 15031-6 §5.6 — two-speed-idle delta diagnosis"
  status: "proposed"
  owning_ledger: "COMLab T-COMV2-DELTA-2"
  source: "labs/obdlab/research/chunks/delta-relations/01-08; labs/comlab/research/PROPOSAL_DeltaLab_cross_lab_delta_module.md; SWEEP_MANIFEST §7 (FU-2)"
  description: >-
    Independent default-off activation of the existing delta_signature on the
    production-default v2 registry path. FaultAtlasRouter.route computes the
    signature through the shared DeltaEngine policy, promotes matching
    scored_rules with max(static score, delta confidence), and asks the registry
    shim to render the re-ranked winner. The separate enable_delta_v2 constructor
    gate permits staged activation and rollback without coupling the v1
    COMLab-DELTA flag.
  field:
    path: "OrchestratorInboundRequest.second_operating_point"
    disposition: "additive-optional (default None)"
    producer: "labs/comlab/comlab/schemas/ingestion.py:SecondOperatingPointFrame"
    consumer_path: "comlab/analytics/delta_engine.py:DeltaEngine.compute_delta_signature -> fault_atlas_router.py v2 scored_rules re-rank (T-COMV2-DELTA-2)"

