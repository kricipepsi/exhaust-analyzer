- id: "COMLab-G"
  family: "symptom-chemistry-footprint"
  consumer: "comlab/comlab/core/fault_atlas_router.py:FaultAtlasRouter._prune_candidates"
  iso_sae_citation: "ISO 15031-6 §5.6 / SAE J1635 — warm-engine tailpipe footprints"
  status: "proposed"
  owning_ledger: "symptomlab_graph T-SYMGRAPH-WIKI-AUTHOR"
  source: "labs/symptomlab/AnswerSymLab.md#Exhaust Gas Chemistry Footprints; labs/dnalab/research/DNAresearch.md#Exhaust Gas Chemistry as Ground Truth"
  reconciles_with:
    - "COMLab-OIL-SIGNATURES / COMLab-OIL-KG already own the oil-specific gas signatures (PCV, turbo, head-gasket oil); rows below cross_ref them rather than redefining."
    - "GASLab ChemicalSignature is the live emission source; these footprints are routing context for chemistry pruning, not new live signatures."
  description: "Per-fault-family warm-engine exhaust-chemistry footprints (HC/CO/NOx and lambda or fuel-consumption shifts). Read by the COMLab Phase-2 chemistry pruning step (chemical_state vs gas_lab_state) as a ground-truth cross-check against the driver-reported symptom. Measured/estimated status is carried per row from the source; gaps left where the source has none."
  baseline_reference: "Certified warm-engine baseline (AnswerSymLab.md): ~0.15 g/km HC, 0.61 g/km CO, 0.26 g/km NOx, 11.01 L/100km. Shifts below are deviations from this baseline."
  footprints_extended:   # AnswerSymLab.md — 10 component fault families
    - fault_family: "Ignition coil / secondary-insulation breakdown"
      hc: "0% tailpipe (>1000 ppm pre-TWC)"
      co: "+60%"
      nox: "-40%"
      fuel_or_lambda: "+6% fuel consumption"
      status: "measured"
    - fault_family: "Vacuum leak / unmetered air ingress"
      hc: "+150 ppm"
      co: "-0.3%"
      nox: ">+1500 ppm engine-out"
      fuel_or_lambda: "lambda > 1.05 (lean)"
      status: "estimated"
    - fault_family: "Catalytic converter melting / degradation (cruise)"
      hc: "+297%"
      co: "+211%"
      nox: "+378%"
      fuel_or_lambda: "+7% fuel consumption"
      status: "measured"
    - fault_family: "Mass-airflow (MAF) sensor contamination"
      hc: "+168%"
      co: "+782%"
      nox: "-86%"
      fuel_or_lambda: "+3% fuel consumption"
      status: "measured"
    - fault_family: "EVAP purge valve stuck open"
      hc: "+200 ppm"
      co: "+1.5%"
      nox: "-15%"
      fuel_or_lambda: "STFT < -10%; +5% to +15% fuel consumption"
      status: "measured"
    - fault_family: "Crankshaft / camshaft position sensor dropout"
      hc: "-100% (stall)"
      co: "-100% (stall)"
      nox: "-100% (stall)"
