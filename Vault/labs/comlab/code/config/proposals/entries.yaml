- id: "COMLab-B"
  family: "symptom-context-modifier"
  consumer: "comlab/comlab/core/fault_atlas_router.py:FaultAtlasRouter.execute_triage_loop" # Reader: T-COMV2-CTXMOD-1
  iso_sae_citation: "SAE J1635 Cold Start Driveability"
  status: "proposed"
  owning_ledger: "DNA family T-DNA-2" # Producer: T-DNA-2
  source: "labs/dnalab/docs/research/DNAresearch.md#Environmental Context Modifiers"

  description: "Consume SymptomDNA.environmental_conditions.load_state as a context modifier for the COMLab symptom prior and cap symptom-prior weighting at 65% trust."
  field:
    path: "symptom_dna.environmental_conditions.load_state"
    enum_values:
      - "idle"
      - "steady_cruise"
      - "transient_acceleration"
      - "coasting_deceleration"
    producer: "labs/symptomlab/symptomlab/models.py:EnvironmentalConditions"
  trust_ceiling:
    max_symptom_prior_weight: 0.65
    rationale: "DNAresearch.md reports a roughly 35% misleading-report floor, so the symptom prior must not exceed 65% trust."
    source_section: "Real-World Rates of False and Misleading Symptom Reports"
  modifiers:
    - load_state: "transient_acceleration"
      promotes:
        - "Ignition Coil insulation breakdown"
        - "Fuel Pump volume restriction"
      demotes:
        - "Minor Vacuum Leak"
      rationale: "Secondary voltage demand peaks under acceleration; minor vacuum leaks are swallowed by open throttle plates."
      source_link: "https://nepis.epa.gov/Exe/ZyPURL.cgi?Dockey=9101EUTV.TXT"
    - load_state: "steady_cruise"
      promotes:
        - "Contaminated MAF Sensor"
        - "EGR flow issues"
      demotes:
        - "Starter Motor / Battery"
      rationale: "Steady-state cruising relies on precise, laminar air mass calculations; EGR flow is active under cruise."
      source_link: "https://nepis.epa.gov/Exe/ZyPURL.cgi?Dockey=9101EUTV.TXT"

- id: "COMLab-C"
  family: "vehicle-dna-projection-paths"
  consumer: "comlab/comlab/projection.py:project"
  iso_sae_citation: "ISO 15031-6 §5.6 / SAE J2012"
  status: "graduated"  # T-COMV2-LAMBDAPROJ-1 — 3 CoC λ reads re-pointed (2026-06-21)
  owning_ledger: "DNA family T-DNA-4"
  source: "labs/dnalab/docs/audits/AUDIT_2026-06-11_dna_vin_rework_and_dna10_answerability.md#Gap Table"
  description: "Fix VehicleDNA projection paths so CoC empirical fields are read from top-level vin_dna.* and emissions equipment flags are read from vin_dna.emissions.*."
  path_fixes:
    - field: "target_lambda_v112"
      from: "vin_dna.emissions.target_lambda_v112"
      to: "vin_dna.target_lambda_v112"
      consumer: "GasLabDnaView.target_lambda_v112 -> GASLab Brettschneider/CoC lambda window"
    - field: "co_low_idle"
      from: "vin_dna.emissions.co_low_idle"
      to: "vin_dna.co_low_idle"
      consumer: "GasLabDnaView.co_low_idle -> GASLab per-vehicle idle CO ceiling"
    - field: "co_high_idle"
      from: "vin_dna.emissions.co_high_idle"
      to: "vin_dna.co_high_idle"
      consumer: "GasLabDnaView.co_high_idle -> GASLab 2500 RPM CO ceiling"
    - field: "has_catalyst"
      from: "vin_dna.has_catalyst"
      to: "vin_dna.emissions.has_catalyst"
      consumer: "Gas/DTC catalyst gating and COMLab catalyst analytics"
    - field: "egr_equipped"
      from: "vin_dna.egr_equipped"
      to: "vin_dna.emissions.egr_equipped"
      consumer: "Gas/DTC EGR fault routing"

- id: "COMLab-D"
  family: "dtc-mirror-reconciliation"
  consumer: "dtclab/dtclab/schemas/dna_view.py:DtcLabDnaView"
  iso_sae_citation: "ISO 15031-6 §5.6 / SAE J2012"
  status: "proposed"
  owning_ledger: "DNA family T-DNA-5"
  source: "labs/dnalab/docs/research/Q8_model_variance.md"
  description: "Relax or drop DTCLab's required DtcLabDnaView.model field so the DTCLab mirror matches COMLab's canonical DtcLabDnaView and VinDNA remains model-free."
  decision:
    field: "model"
    disposition: "KEEP-EMPTY"
    rationale: "DBS specimens contain 7,079 non-empty P15_engine_code rows and 7,079 unique codes, leaving no within-engine-code CoC replicate groups for V112_lambda, V101_CO_low_idle, V111_CO_high_idle, or P14_rated_rpm. No variance evidence justifies adding VinDNA.model."
    dtclab_action: "Make model optional or remove it from the local DtcLabDnaView mirror in the paired DTCLab/COMLab-D reconciliation task."

- id: "COMLab-E"
  family: "vehicle-dna-fuel-context"
  consumer: "comlab/comlab/schemas/lab_dna_views.py:GasLabDnaView"
  iso_sae_citation: "ISO 15031-6 §5.6 / SAE J2012"
  status: "proposed"
  owning_ledger: "DNA family T-DNA-6"
  source: "labs/gaslab/wiki/01_role_boundaries_dna_ingestion.md#14-the-gaslabdnaview--the-slim-dna-slice"
  description: "Register proposed VinDNA.fuel_type as GASLab context for E5/E10/winter-blend lambda-correction handling; do not add it to live VinDNA until the paired GASLab/COMLab consumer lands."
  field:
    path: "vin_dna.fuel_type"
    disposition: "proposal-only"
    proposed_values:
      - "e5"
      - "e10"
      - "winter_blend"
      - "unknown"
    producer: "labs/vinlab/VehicleDNA.md draft contract Section 4.1"
    consumer_path: "COMLab.comlab.schemas.lab_dna_views.GasLabDnaView -> GASLab lab_dna_views context"
  rationale:
    fuel_type: "GASLab wiki Section 1.4 lists fuel_type as proposed v2 context for E5/E10/winter-blend correction; the field has a named proposed consumer, so it belongs in the proposals registry rather than silently in the live schema."
    altitude_band: "altitude_band remains session/context, not a VinDNA schema field, because the GASLab wiki records it as informational only and lambda math is altitude-invariant."
  draft_contract_line: "VinDNA.fuel_type: optional proposed fuel-blend context for GASLab E5/E10/winter-blend lambda-correction; status proposal-only until GasLabDnaView projection and GASLab consumer are implemented."

- id: "COMLab-F"
  family: "symptom-prior-bands"
  consumer: "comlab/comlab/core/fault_atlas_router.py:FaultAtlasRouter._load_prior_table"
  iso_sae_citation: "SAE J1635 Cold Start Driveability / SAE J2944 Driving Performance Measures"
  status: "proposed"
  owning_ledger: "symptomlab_graph T-SYMGRAPH-WIKI-AUTHOR"
  source: "labs/dnalab/research/DNAresearch.md#Per-Tier 1 Diagnostic Prior Strengths"
  reconciles_with:
    - "COMLab-A supplies the (tier_1, tier_2) -> fault_family routing keys these bands weight."
    - "COMLab-B supplies the report-trust cap (max_symptom_prior_weight 0.65) that bounds every band below."
  description: "Per-Tier-1 heuristic weighting bands: how strongly each candidate fault family is favoured before any physical measurement. SymptomLab supplies the tier vocabulary; these bands are read by the COMLab symptom-prior table. Bands are capped by the COMLab-B report-trust ceiling and are structured starting estimates, not absolute truths (see honesty_note)."
  honesty_note: "Bands marked 'estimated' are expert-guided; 'measured' bands derive from repair-database frequencies (RepairPal, CarMD Vehicle Health Index, N=31,740,965 repairs). No empirical confusion matrix exists without commercially-licensed paired symptom->repair data, so all bands must be treated as structured starting estimates."
  measured_category_frequencies:
    - tier_1: "rough_idle_shudder"
      bands:
        - fault_family: "Vacuum Leak / Unmetered Air"
          frequency: "64% of verified cases"
        - fault_family: "Spark Plug degradation"
          frequency: "21% of verified cases"
        - fault_family: "Ignition Coil failure"
          frequency: "15% of verified cases"
      status: "measured"
      source_db: "RepairPal database"
      source_link: "https://repairpal.com/symptom/bmw/328d/2014/rough-idle"
    - scope: "national check-engine-light repair share (CarMD Vehicle Health Index)"
      shares:
        - fault: "Catalytic converter"
          share: "6.26%"
        - fault: "Oxygen sensor"
          share: "6.16%"
        - fault: "Ignition coil + spark plug set"
          share: "5.23%"
        - fault: "Mass airflow (MAF) sensor"
          share: "5.01%"
        - fault: "EVAP purge valve"
          share: "4.43%"
      sample_size_n: 31740965
      status: "measured"
      source_link: "https://www.aftermarketmatters.com/wp-content/uploads/2025/04/CarMD_Index_APR25_042325.pdf"
  per_tier_bands:
    - tier_1: "vehicle_starting_issues"
      bands:
        - fault_family: "Battery / Starter / Charging Circuit"
          band: "High (50-70%)"
          status: "estimated"
        - fault_family: "Fuel-Delivery (Pump check-valve / leakdown)"
          band: "Moderate (20-30%)"
          status: "estimated"
        - fault_family: "Engine Mechanical (Low Compression)"
          band: "Low (<10%)"
          status: "estimated"
    - tier_1: "rough_idle_shudder"
      bands:
        - fault_family: "Vacuum Leak / Unmetered Air"
          band: "High (50-70%)"
          status: "measured"
        - fault_family: "Ignition System (Spark Plugs / Coils)"
          band: "Moderate (20-30%)"
          status: "measured"
        - fault_family: "Engine Mechanical (Low Compression / Valves)"
          band: "Low (<10%)"
          status: "estimated"
    - tier_1: "lack_of_power_hesitation"
      bands:
        - fault_family: "Ignition System (Coil breakdown under load)"
          band: "High (50-70%)"
          status: "estimated"
        - fault_family: "Air-Fuel Metering (Contaminated MAF / O2)"
          band: "Moderate (20-30%)"
          status: "estimated"
        - fault_family: "Catalyst / Exhaust Restriction"
          band: "Low (<10%)"
          status: "measured"
    - tier_1: "poor_economy_fuel_odor_sound"
      bands:
        - fault_family: "Emission Control Sensors (Oxygen / CTS bias)"
