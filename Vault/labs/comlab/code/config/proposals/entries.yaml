      status: "estimated"
      cross_ref: "oil/coolant breach signature in COMLab-OIL-KG (HEAD_GASKET_OIL_BREACH)"
    - fault_family: "Leaking / stuck-open fuel injector"
      hc: "+49%"
      co: "-5%"
      nox: "+352%"
      fuel_or_lambda: "+15% to +30% fuel consumption"
      status: "measured"
    - fault_family: "Coolant-temperature-sensor (CTS) bias cold"
      hc: "+1284.6% (FTP)"
      co: "+3175% (FTP); 8.49% tailpipe"
      nox: "+201.2% (FTP)"
      fuel_or_lambda: "lambda = 0.77 (extremely rich)"
      status: "measured"
  footprints_baseline:   # DNAresearch.md — 6 controlled-condition families
