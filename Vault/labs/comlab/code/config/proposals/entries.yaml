- id: "COMLab-A"
  family: "symptom-prior-routing"
  consumer: "comlab/comlab/core/fault_atlas_router.py:FaultAtlasRouter"
  iso_sae_citation: "SAE J1635 Cold Start Driveability"
  status: "proposed"
  owning_ledger: "DNA family T-DNA-1"
  source: "labs/dnalab/docs/research/DNAresearch.md#Revised Driveability Symptom Catalog"
  description: "Register revised SymptomDNA tier_1/tier_2 strings as routing keys for the COMLab symptom-to-fault-family prior."
  mappings:
    - tier_1: "vehicle_starting_issues"
      tier_2: "no_crank_silent"
      fault_family: "Ignition Primary / Battery / Starter Circuit"
      rationale: "Complete electrical silence points directly to high-current circuit failure or battery depletion."
      source_link: "https://www.sae.org/standards/j1635_200210-sae-cold-start-driveability-procedure"
    - tier_1: "vehicle_starting_issues"
      tier_2: "fast_crank_whining"
      fault_family: "Valve-Timing / Mechanical Compression"
      rationale: "Rapid, resistance-free cranking indicates a complete loss of compression, typically from a broken timing belt or chain."
      source_link: "https://www.sae.org/standards/j1635_200210-sae-cold-start-driveability-procedure"
    - tier_1: "vehicle_starting_issues"
      tier_2: "prolonged_crank_hard_start"
      fault_family: "Fuel-Delivery / Coolant-Temp-Sensor"
      rationale: "Leaking fuel injectors or check valves cause fuel rail depressurization, requiring long cranking to prime."
      source_link: "https://www.sae.org/standards/j1635_200210-sae-cold-start-driveability-procedure"
    - tier_1: "rough_idle_shudder"
      tier_2: "constant_vibration_shudder"
      fault_family: "Ignition-Coil / Spark Plug (Misfire)"
      rationale: "Persistent shaking at idle represents a standard combustion drop in a single cylinder."
      source_link: "https://www.sae.org/standards/j1635_200210-sae-cold-start-driveability-procedure"
    - tier_1: "rough_idle_shudder"
      tier_2: "surging_hunting_idle"
      fault_family: "Vacuum Leak / Idle-Control"
      rationale: "Rhythmic RPM oscillations reflect the Engine Control Module struggling to regulate air bypass against unmetered air."
      source_link: "https://static.nhtsa.gov/odi/inv/2010/INRD-PE10019-48742.pdf"
    - tier_1: "rough_idle_shudder"
      tier_2: "stalls_on_cold_start"
      fault_family: "Coolant-Temp-Sensor / Vacuum Leak"
      rationale: "Stalling immediately after ignition indicates thermal manifold shrink leaks or incorrect cold start enrichment."
      source_link: "https://www.sae.org/standards/j1635_200210-sae-cold-start-driveability-procedure"
    - tier_1: "lack_of_power_hesitation"
      tier_2: "flat_sluggish_always"
      fault_family: "Catalyst / Air-Fuel Metering (MAF)"
      rationale: "Persistent sluggishness points to exhaust restriction from a melted catalyst or severe air-mass calculation bias."
      source_link: "https://nepis.epa.gov/Exe/ZyPURL.cgi?Dockey=9101EUTV.TXT"
    - tier_1: "lack_of_power_hesitation"
      tier_2: "hesitation_throttle_tip_in"
      fault_family: "Throttle Sensor / Transient Fueling"
      rationale: "Delays during throttle tip-in point to transient fueling delay or a worn throttle position sensor potentiometer."
      source_link: "https://nepis.epa.gov/Exe/ZyPURL.cgi?Dockey=9101EUTV.TXT"
    - tier_1: "lack_of_power_hesitation"
      tier_2: "sudden_jerk_stumble"
      fault_family: "Ignition-Coil (Dielectric Breakdown)"
      rationale: "Severe stumbling under load is caused by ignition voltage escaping weak coil insulation under high cylinder pressure."
      source_link: "https://nepis.epa.gov/Exe/ZyPURL.cgi?Dockey=9101EUTV.TXT"
    - tier_1: "poor_economy_fuel_odor_sound"
      tier_2: "just_poor_mpg"
      fault_family: "Oxygen-Sensor / Coolant-Temp-Sensor"
      rationale: "Unexplained drop in MPG is caused by sensor-induced rich-fuel adaptation cycles keeping the ECU in open loop."
      source_link: "https://www.dinmedia.de/en/standard/sae-j-2944/365090629"
    - tier_1: "poor_economy_fuel_odor_sound"
      tier_2: "strong_fuel_smell"
      fault_family: "Fuel-Delivery (Leaking Injector)"
      rationale: "Strong raw gasoline odor indicates physical rail leaks or an injector stuck open and drooling fuel."
      source_link: "https://www.dinmedia.de/en/standard/sae-j-2944/365090629"
    - tier_1: "poor_economy_fuel_odor_sound"
      tier_2: "knock_pinging_under_load"
      fault_family: "EGR-System / Lean-Misfire"
      rationale: "Metallic pinging under mechanical load reflects high combustion temperatures from failed exhaust gas dilution."
      source_link: "https://www.dinmedia.de/en/standard/sae-j-2944/365090629"
    - tier_1: "engine_dies_or_stalls"
      tier_2: "when_coasting_to_stop"
      fault_family: "Idle-Control (Carbon Restriction)"
      rationale: "Stalling upon throttle release indicates carbon-clogged idle bypass ports failing to catch dropping engine speeds."
      source_link: "https://static.nhtsa.gov/odi/inv/2010/INRD-PE10019-48742.pdf"
    - tier_1: "engine_dies_or_stalls"
      tier_2: "intermittent_random_cutout"
      fault_family: "Crank/Cam Position Sensors"
      rationale: "Instantaneous cutout without stumbling indicates a complete loss of crankshaft engine-speed synchronization."
      source_link: "https://nepis.epa.gov/Exe/ZyPURL.cgi?Dockey=9101EUTV.TXT"
    - tier_1: "engine_dies_or_stalls"
      tier_2: "backfire_loud_pop"
      fault_family: "Ignition-Coil / Valve-Timing"
      rationale: "Mistimed spark or misaligned valves ignite unburned fuel directly within the intake or exhaust manifolds."
      source_link: "https://nepis.epa.gov/Exe/ZyPURL.cgi?Dockey=9101EUTV.TXT"
    - tier_1: "visible_exhaust_smoke"
      tier_2: "black_smoke"
      fault_family: "Fuel-Delivery (Extreme Rich Mixture)"
      rationale: "Dark carbon soot is the typical byproduct of raw, unburned gasoline in rich combustion."
      source_link: "https://www.sae.org/standards/j1635_199808-sae-cold-start-driveability-procedure"
    - tier_1: "visible_exhaust_smoke"
      tier_2: "blue_oily_smell"
      fault_family: "Engine Mechanical (Valve Stem Seals)"
      rationale: "Oil migrating past worn valve guides or piston rings burns in the cylinders, emitting bluish-grey smoke."
      source_link: "https://www.sae.org/standards/j1635_199808-sae-cold-start-driveability-procedure"
    - tier_1: "visible_exhaust_smoke"
      tier_2: "white_sweet_smell"
      fault_family: "Engine Mechanical (Head Gasket)"
      rationale: "Billowing white steam indicates glycol-based coolant is leaking directly into the combustion chamber."
      source_link: "https://www.sae.org/standards/j1635_199808-sae-cold-start-driveability-procedure"
    - tier_1: "oil_consumption"
      tier_2: "blue_smoke_on_cold_start_clears"
      fault_family: "Engine Mechanical (Valve Stem Seals)"
      rationale: "Bluish smoke at cold start that clears upon driving indicates oil leaking past degraded valve stem seals."
      source_link: "https://www.sae.org/standards/j1635_199808-sae-cold-start-driveability-procedure"
      future_consumer: "U-OIL-KG-1 v2 KG enrichment consumes this proposal-only symptom key; MW-002 already covers the live registry verdict."
    - tier_1: "oil_consumption"
      tier_2: "blue_smoke_under_acceleration"
      fault_family: "Engine Mechanical (Piston Rings)"
      rationale: "Bluish smoke under acceleration indicates oil passing worn piston rings or turbine seals under high cylinder/exhaust load."
      source_link: "https://www.sae.org/standards/j1635_199808-sae-cold-start-driveability-procedure"
      future_consumer: "T-OIL-R5 turbo rule and U-OIL-KG-1 v2 KG enrichment consume this proposal-only symptom key; MW-001 already covers the live ring verdict."
    - tier_1: "oil_consumption"
      tier_2: "oil_loss_no_visible_smoke"
      fault_family: "Engine Mechanical (PCV/Crankcase)"
      rationale: "Oil consumption without visible smoke is typical of a stuck-open PCV valve causing slow oil draw at low load."
      source_link: "https://static.nhtsa.gov/odi/inv/2010/INRD-PE10019-48742.pdf"
      future_consumer: "T-OIL-R4 PCV rule and U-OIL-KG-1 v2 KG enrichment consume this proposal-only symptom key."

