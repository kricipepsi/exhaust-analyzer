# Plain copies - intentionally NOT framed (signal/noise). The build copies the whole
# wiki/ + docs/ tree regardless; this list documents WHY each is left unframed.
plain:
  # wiki: index + proposal/Gate-gated/validation-only notes (no live code consumer)
  - 00_index.md                       # index, no consumer
  - 08_scoring_to_fusion_rework.md    # FUSE_* fusion rework all (proposed)
  - 09_calibration_confidence.md      # CONCEPT_CALIBRATION/CONF_TIER/CONFORMAL all (proposed)
  - 11_two_point_delta.md             # two-point delta default-off, LIVE_GATED_ON GATE_CAPTURE
  - 12_corpus_eval_discipline.md      # consumers are "COMLab validation", not code paths
  - 13_proposals_register.md          # proposals register (EP-* / COMLab-*)
  - 14_sources_appendices.md          # sources / glossary, no code consumer
  # docs: BDD + ADRs + cross-lab notes + vocab mirrors (vocab homed in _vocabulary/)
  - COMLab_BDD.md
  - CROSS_LAB_DEPENDENCIES.md
