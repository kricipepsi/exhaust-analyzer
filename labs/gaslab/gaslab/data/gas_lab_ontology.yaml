    citation: "GAS_WIKI §7.17"
    operating_state: "STABILIZED_IDLE"
    signature:
      hc:  { min: 0,   max: 100 }    # wiki: GAS_WIKI §7.17 — no change / slight decrease
      co:  { min: 0.0, max: 0.5 }    # wiki: GAS_WIKI §7.17 — slight decrease
      co2: { min: 13.0, max: 16.0 }  # wiki: GAS_WIKI §7.17 — slight decrease
      o2:  { min: 0.0, max: 0.5 }    # wiki: GAS_WIKI §7.17 — no change / slight decrease
      nox: { min: 0,   max: 100 }    # wiki: GAS_WIKI §7.17 — no change / slight decrease
      lambda: { min: 0.97, max: 1.03 }  # wiki: GAS_WIKI §7.17 — ≈ 1.0
    differentiator_edges:
