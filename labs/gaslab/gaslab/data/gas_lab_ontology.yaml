  GDI_HPFP_INTERNAL_SEAL_LEAK:
    citation: "GAS_WIKI §7.20"
    operating_state: "STABILIZED_IDLE"
    dna_gate:
      field: "fuel_delivery_type"
      value: "GDI"                   # vocab: GAS_VOCABULARY §3.1
    signature:
      hc:  { min: 300, max: 20000 }  # wiki: GAS_WIKI §7.20 — high (same tailpipe as §7.19)
      co:  { min: 3.0, max: 15.0 }   # wiki: GAS_WIKI §7.20 — > 3.0 %
      co2: { min: 0.0, max: 13.0 }   # wiki: GAS_WIKI §7.20 — low
      o2:  { min: 0.0, max: 0.3 }    # wiki: GAS_WIKI §7.20 — very low
      nox: { min: 0,   max: 50 }     # wiki: GAS_WIKI §7.20 — very low
      lambda: { min: 0.5, max: 0.85 }  # wiki: GAS_WIKI §7.20 — < 0.85
    differentiator_edges:
