# GASLab Declarative Ontology — hand-crafted knowledge graph.
#
# Every entry carries a citation: key pointing to GAS_WIKI.md or GAS_VOCABULARY.md.
# The 32 fault entries map 1:1 to ChemicalSignature values (GAS_VOCABULARY §3).
# Per-gas thresholds derive from GAS_VOCABULARY §10.1–§10.5.
#
# Format version 1.0.  Do not edit without a matching wiki change.

version: "1.0"
scope: "Petrol 1990-2020 / 5-gas / warm-only"

# ---------------------------------------------------------------------------
# Validity gates — wiki: GAS_WIKI §6
# ---------------------------------------------------------------------------

validity_gates:
  exhaust_gas_triangle:
    citation: "GAS_WIKI §6.1"
    description: >
      Invariant CO + CO2 + O2 sum.  Outside [14, 18] halts evaluation.
      Source: GAS_WIKI §6.1; thresholds from GAS_VOCABULARY §10.6.
    sum_valid_min: 14.0       # wiki: GAS_WIKI §6.1, vocab: GAS_VOCABULARY §10.6
    sum_valid_max: 16.0       # wiki: GAS_WIKI §6.1, vocab: GAS_VOCABULARY §10.6
    sum_external_o2_max: 18.0 # wiki: GAS_WIKI §6.1, vocab: GAS_VOCABULARY §10.6

  dilution_screen:
    citation: "GAS_WIKI §6.2"
    description: >
      Rapid sanity check: CO + CO2 must exceed 6 % in an undiluted sample.
    co_plus_co2_floor: 6.0    # wiki: GAS_WIKI §6.2, vocab: GAS_VOCABULARY §10.6

# ---------------------------------------------------------------------------
# Reasoning grammar — wiki: GAS_WIKI §8
# ---------------------------------------------------------------------------

reasoning_grammar:
  collision_rule:
    citation: "GAS_WIKI §8.5"
    description: >
      CO and O2 both elevated is physically impossible in a single balanced
      combustion event.  Disambiguated by the triangle: sum ~15 → RICH_MISFIRE;
      sum > 16 → EXHAUST_AIR_LEAK.  EXHAUST_AIR_LEAK path additionally requires
      HC Normal (§7.7) — high HC with the collision pattern is RICH_MISFIRE.
    co_tier_max: 0.45             # vocab: GAS_VOCABULARY §10.2 — Euro 4 with cat
    o2_threshold: 2.0             # wiki: GAS_WIKI §8.5
    triangle_sum_threshold: 16.0  # wiki: GAS_WIKI §8.5 — sum > 16 → EXHAUST_AIR_LEAK, ≤ 16 → RICH_MISFIRE
    hc_max: 100                   # wiki: GAS_WIKI §7.7 — EXHAUST_AIR_LEAK requires HC Normal; vocab: GAS_VOCABULARY §10.1 normal_borderline.max

  masking_rule:
    citation: "GAS_WIKI §8.4"
    description: >
      High HC + high O2 + low NOx → IGNITION_MISFIRE override.
      No combustion means no heat, killing NOx despite the air looking lean.
    hc_threshold: 1000        # vocab: GAS_VOCABULARY §10.1 — ignition_misfire_floor
    o2_threshold: 3.0         # wiki: GAS_WIKI §8.4
    nox_threshold: 50         # vocab: GAS_VOCABULARY §10.5 — misfire_suppression max

  cam_timing_rule:
    citation: "GAS_WIKI §8.6"
    description: >
      HC > 1000 ppm AND CO present AND O₂ > 2.0 % ⇒ CAM_TIMING_RETARDED_MAF or CAM_TIMING_ADVANCED.
      Priority 82 per GAS_VOCABULARY §14 — between masking (85) and collision (80).
    hc_threshold: 1000        # vocab: GAS_VOCABULARY §10.1 — ignition_misfire_floor
    o2_threshold: 2.0         # wiki: GAS_WIKI §8.6

  coolant_intrusion_rule:
    citation: "GAS_WIKI §8.7"
    description: >
      Depressed CO₂ (≤ 12.0 %) from water-vapour dilution + elevated HC (≥ 300 ppm)
      from ethylene-glycol hydrocarbon flash + positive chemical block test ⇒
      COOLANT_LEAK_INTERNAL. Priority 87 — above masking (85) because liquid water
      intrusion completely halts normal combustion physics.
      Source: CoolantLeakSig.md §1–§3; GAS_WIKI §8.7.
    co2_threshold: 12.0       # wiki: GAS_WIKI §8.7 — dilution floor; CoolantLeakSig.md §3
    hc_threshold: 300.0       # wiki: GAS_WIKI §8.7 — ethylene-glycol HC flash floor; CoolantLeakSig.md §3

# ---------------------------------------------------------------------------
# Fault signature atlas — wiki: GAS_WIKI §7.1 – §7.28
# ---------------------------------------------------------------------------
# Keys match ChemicalSignature StrEnum values exactly (GAS_VOCABULARY §3).
# signature: per-gas {min, max} bounds from the baseline Euro 4 / warm / cat
#   reference.  dna_gate, rpm_dependent, clears_at_2500_rpm are optional.
#   differentiator_edges is populated by T-P3-1.

faults:

  # --- §7.1 ----------------------------------------------------------------
  NORMAL_OPERATION:
    citation: "GAS_WIKI §7.1"
    operating_state: "STABILIZED_IDLE"
    signature:
      hc:  { min: 0,   max: 35 }     # vocab: GAS_VOCABULARY §10.1 normal_with_cat
      co:  { min: 0.1, max: 0.45 }   # vocab: GAS_VOCABULARY §10.2 normal_with_cat
      co2: { min: 14.5, max: 16.0 }  # vocab: GAS_VOCABULARY §10.3 peak_efficiency
      o2:  { min: 0.0, max: 0.35 }   # vocab: GAS_VOCABULARY §10.4 normal_post_cat
      nox: { min: 0,   max: 100 }    # vocab: GAS_VOCABULARY §10.5 normal_idle
      lambda: { min: 0.995, max: 1.005 }  # vocab: GAS_VOCABULARY §10.7 catalyst_peak_efficiency

  # --- §7.2 ----------------------------------------------------------------
  RICH_MIXTURE:
    citation: "GAS_WIKI §7.2"
    operating_state: "STABILIZED_IDLE"
    signature:
      hc:  { min: 0,   max: 300 }     # wiki: GAS_WIKI §7.2 — normal–moderate
      co:  { min: 0.5, max: 15.0 }    # vocab: GAS_VOCABULARY §10.2 mild_rich floor
      co2: { min: 0.0, max: 13.0 }    # wiki: GAS_WIKI §7.2 — < 13 %
      o2:  { min: 0.0, max: 1.0 }     # vocab: GAS_VOCABULARY §10.4 normal_pre_cat low end — rich mixture may show residual O₂ from incomplete combustion
      nox: { min: 0,   max: 100 }     # vocab: GAS_VOCABULARY §10.5 normal_idle max
      lambda: { min: 0.5, max: 0.97 } # vocab: GAS_VOCABULARY §10.7 borderline_rich max

  # --- §7.3 ----------------------------------------------------------------
  LEAN_MIXTURE:
    citation: "GAS_WIKI §7.3"
    operating_state: "STABILIZED_IDLE"
    signature:
      hc:  { min: 0,   max: 300 }     # wiki: GAS_WIKI §7.3 — < 300 ppm
      co:  { min: 0.0, max: 0.1 }     # wiki: GAS_WIKI §7.3 — < 0.1 %
      co2: { min: 0.0, max: 13.0 }    # wiki: GAS_WIKI §7.3 — < 13 %
      o2:  { min: 2.5, max: 22.0 }    # wiki: GAS_WIKI §7.3 — > 2.5 %, vocab: GAS_VOCABULARY §10.4 mild_lean
      nox: { min: 0,   max: 5000 }    # wiki: GAS_WIKI §7.3 — very high under load; variable at idle
      lambda: { min: 1.05, max: 2.5 } # wiki: GAS_WIKI §7.3 — > 1.05, vocab: GAS_VOCABULARY §10.7

  # --- §7.4 ----------------------------------------------------------------
  IGNITION_MISFIRE:
    citation: "GAS_WIKI §7.4"
    operating_state: "STABILIZED_IDLE"
    signature:
      hc:  { min: 1000, max: 20000 }  # vocab: GAS_VOCABULARY §10.1 ignition_misfire_floor
      co:  { min: 0.0,  max: 0.5 }    # wiki: GAS_WIKI §7.4 — normal–low
      co2: { min: 0.0,  max: 10.0 }   # wiki: GAS_WIKI §7.4 — < 10 %
      o2:  { min: 3.0,  max: 22.0 }   # wiki: GAS_WIKI §7.4 — > 3.0 %
      nox: { min: 0,    max: 50 }     # vocab: GAS_VOCABULARY §10.5 misfire_suppression
      lambda: { min: 1.0, max: 2.5 }  # wiki: GAS_WIKI §7.4 — ≥ 1.0 (false-lean)

  # --- §7.5 ----------------------------------------------------------------
  LEAN_MISFIRE:
    citation: "GAS_WIKI §7.5"
    operating_state: "STABILIZED_IDLE"
    signature:
      hc:  { min: 200, max: 600 }     # wiki: GAS_WIKI §7.5, vocab: GAS_VOCABULARY §10.1 lean_misfire_range
      co:  { min: 0.0, max: 0.2 }     # wiki: GAS_WIKI §7.5 — < 0.2 %
      co2: { min: 0.0, max: 12.0 }    # wiki: GAS_WIKI §7.5 — < 12 %
      o2:  { min: 4.0, max: 22.0 }    # wiki: GAS_WIKI §7.5 — > 4 %, vocab: GAS_VOCABULARY §10.4 severe_lean_or_misfire
      nox: { min: 0,   max: 5000 }    # wiki: GAS_WIKI §7.5 — variable
      lambda: { min: 1.15, max: 2.5 } # wiki: GAS_WIKI §7.5 — > 1.15

  # --- §7.6 ----------------------------------------------------------------
  RICH_MISFIRE:
    citation: "GAS_WIKI §7.6"
    operating_state: "STABILIZED_IDLE"
    signature:
      hc:  { min: 300, max: 20000 }   # wiki: GAS_WIKI §7.6 — high, vocab: GAS_VOCABULARY §10.1 real_combustion_fault
      co:  { min: 1.0, max: 15.0 }    # wiki: GAS_WIKI §7.6 — > 1.0 %
      co2: { min: 0.0, max: 13.0 }    # wiki: GAS_WIKI §7.6 — low
      o2:  { min: 2.0, max: 22.0 }    # wiki: GAS_WIKI §7.6 — > 2.0 %
      nox: { min: 0,   max: 100 }     # wiki: GAS_WIKI §7.6 — low
      lambda: { min: 0.5, max: 1.0 }  # wiki: GAS_WIKI §7.6 — < 1.0

  # --- §7.7 ----------------------------------------------------------------
  EXHAUST_AIR_LEAK:
    citation: "GAS_WIKI §7.7"
    operating_state: "STABILIZED_IDLE"
    signature:
      hc:  { min: 0,   max: 100 }     # wiki: GAS_WIKI §7.7 — normal
      co:  { min: 0.1, max: 0.5 }     # wiki: GAS_WIKI §7.7 — normal
      co2: { min: 0.0, max: 13.0 }    # wiki: GAS_WIKI §7.7 — low
      o2:  { min: 2.0, max: 22.0 }    # wiki: GAS_WIKI §7.7 — > 2 %
      nox: { min: 0,   max: 100 }     # wiki: GAS_WIKI §7.7 — low
      lambda: { min: 1.05, max: 2.5 } # wiki: GAS_WIKI §7.7 — falsely > 1.05

  # --- §7.8 ----------------------------------------------------------------
  HIGH_COMBUSTION_TEMP:
    citation: "GAS_WIKI §7.8"
    operating_state: "STABILIZED_IDLE"
    signature:
      hc:  { min: 0,   max: 100 }     # wiki: GAS_WIKI §7.8 — normal
      co:  { min: 0.1, max: 0.5 }     # wiki: GAS_WIKI §7.8 — normal
      co2: { min: 13.0, max: 16.0 }   # wiki: GAS_WIKI §7.8 — normal–high
      o2:  { min: 0.0, max: 0.5 }     # wiki: GAS_WIKI §7.8 — normal
      nox: { min: 1000, max: 5000 }   # vocab: GAS_VOCABULARY §10.5 high_combustion_temp
      lambda: { min: 0.97, max: 1.03 }  # wiki: GAS_WIKI §7.8 — ≈ 1.0, vocab: GAS_VOCABULARY §10.7 stoichiometric
    differentiator_edges:
      - type: dna
        field: emissions.egr_equipped
        equals: false                                     # wiki: GAS_WIKI §7.25 — overlap disambiguation vs EGR_STUCK_CLOSED

  # --- §7.9 ----------------------------------------------------------------
  CATALYST_NOT_LIGHTING_OFF:
    citation: "GAS_WIKI §7.9"
    operating_state: "STABILIZED_IDLE"
    dna_gate:
      field: "emissions.has_catalyst"
      value: true                    # vocab: GAS_VOCABULARY §3.1
    signature:
      hc:  { min: 75,  max: 125 }    # wiki: GAS_WIKI §7.9
      co:  { min: 0.5, max: 0.9 }    # wiki: GAS_WIKI §7.9, vocab: GAS_VOCABULARY §10.2 cat_not_lit_band
      co2: { min: 13.5, max: 14.5 }  # wiki: GAS_WIKI §7.9, vocab: GAS_VOCABULARY §10.3 cat_not_lit_band
      o2:  { min: 0.3, max: 0.7 }    # wiki: GAS_WIKI §7.9, vocab: GAS_VOCABULARY §10.4 cat_not_lit_band
      nox: { min: 0,   max: 100 }    # wiki: GAS_WIKI §7.9 — normal
      lambda: { min: 0.995, max: 1.005 }  # wiki: GAS_WIKI §7.9, vocab: GAS_VOCABULARY §10.7 catalyst_peak_efficiency

  # --- §7.10 ---------------------------------------------------------------
  CATALYST_OVERWHELMED:
    citation: "GAS_WIKI §7.10"
    operating_state: "STABILIZED_IDLE"
    dna_gate:
      field: "emissions.has_catalyst"
      value: true                    # vocab: GAS_VOCABULARY §3.1
    signature:
      hc:  { min: 200, max: 20000 }  # wiki: GAS_WIKI §7.10 — > 200 ppm, vocab: GAS_VOCABULARY §10.1 real_combustion_fault
      co:  { min: 1.0, max: 15.0 }   # wiki: GAS_WIKI §7.10 — > 1.0 %
      co2: { min: 0.0, max: 12.0 }   # wiki: GAS_WIKI §7.10 — < 12 %
      o2:  { min: 0.0, max: 22.0 }   # wiki: GAS_WIKI §7.10 — variable
      nox: { min: 500, max: 5000 }   # wiki: GAS_WIKI §7.10 — > 500 ppm, vocab: GAS_VOCABULARY §10.5 elevated_idle
      lambda: { min: 0.5, max: 2.5 } # wiki: GAS_WIKI §7.10 — variable

  # --- §7.11 ---------------------------------------------------------------
  SAMPLE_INVALID:
    citation: "GAS_WIKI §7.11"
    operating_state: "STABILIZED_IDLE"
    signature:
      hc:  { min: 0, max: 20000 }    # wiki: GAS_WIKI §7.11 — no specific signature; gate-halted
      co:  { min: 0.0, max: 15.0 }
      co2: { min: 0.0, max: 22.0 }
      o2:  { min: 0.0, max: 22.0 }
      nox: { min: 0, max: 5000 }
      lambda: { min: 0.5, max: 2.5 }

  # --- §7.12 ---------------------------------------------------------------
  TIMING_OVER_ADVANCED:
    citation: "GAS_WIKI §7.12"
    operating_state: "STABILIZED_IDLE"
    signature:
      hc:  { min: 0,   max: 100 }    # wiki: GAS_WIKI §7.12 — slight increase
      co:  { min: 0.0, max: 0.5 }    # wiki: GAS_WIKI §7.12 — no change / slight decrease
      co2: { min: 13.0, max: 16.0 }  # wiki: GAS_WIKI §7.12 — no change
      o2:  { min: 0.0, max: 0.5 }    # wiki: GAS_WIKI §7.12 — no change
      nox: { min: 1000, max: 5000 }  # wiki: GAS_WIKI §7.12 — very high, vocab: GAS_VOCABULARY §10.5 high_combustion_temp
      lambda: { min: 0.97, max: 1.03 }  # wiki: GAS_WIKI §7.12 — ≈ 1.0

  # --- §7.13 ---------------------------------------------------------------
  TIMING_RETARDED:
    citation: "GAS_WIKI §7.13"
    operating_state: "STABILIZED_IDLE"
    signature:
      hc:  { min: 0,   max: 100 }    # wiki: GAS_WIKI §7.13 — slight increase
      co:  { min: 0.0, max: 0.5 }    # wiki: GAS_WIKI §7.13 — no change / slight increase
      co2: { min: 11.0, max: 16.0 }  # wiki: GAS_WIKI §7.13 — no change to moderate drop, vocab: GAS_VOCABULARY §10.3 combustion_deficit
      o2:  { min: 0.0, max: 0.5 }    # wiki: GAS_WIKI §7.13 — no change
      nox: { min: 0,   max: 50 }     # wiki: GAS_WIKI §7.13 — very low, vocab: GAS_VOCABULARY §10.5 misfire_suppression
      lambda: { min: 0.97, max: 1.03 }  # wiki: GAS_WIKI §7.13 — ≈ 1.0

  # --- §7.14 ---------------------------------------------------------------
  O2_SENSOR_BIASED_LOW:
    citation: "GAS_WIKI §7.14"
    operating_state: "STABILIZED_IDLE"
    signature:
      hc:  { min: 0,   max: 100 }    # wiki: GAS_WIKI §7.14 — slight increase
      co:  { min: 0.5, max: 3.0 }    # wiki: GAS_WIKI §7.14 — moderate–high increase, vocab: GAS_VOCABULARY §10.2 mild_rich
      co2: { min: 13.0, max: 16.0 }  # wiki: GAS_WIKI §7.14 — slight decrease
      o2:  { min: 0.0, max: 0.3 }    # wiki: GAS_WIKI §7.14 — low
      nox: { min: 0,   max: 100 }    # wiki: GAS_WIKI §7.14 — slight decrease
      lambda: { min: 0.5, max: 1.0 } # wiki: GAS_WIKI §7.14 — < 1.0 (rich)
    differentiator_edges:
      - type: physical_check
        key: O2_SENSOR_VOLTAGE_SWING_TEST                  # wiki: GAS_WIKI §7.14
      - type: rpm_differential
        note: "sensor bias is RPM-flat; mechanical faults vary with load"  # wiki: GAS_WIKI §7.14, §11.2

  # --- §7.15 ---------------------------------------------------------------
  O2_SENSOR_BIASED_HIGH:
    citation: "GAS_WIKI §7.15"
    operating_state: "STABILIZED_IDLE"
    signature:
      hc:  { min: 0,   max: 100 }    # wiki: GAS_WIKI §7.15 — slight increase
      co:  { min: 0.0, max: 0.2 }    # wiki: GAS_WIKI §7.15 — low
      co2: { min: 13.0, max: 16.0 }  # wiki: GAS_WIKI §7.15 — slight decrease
      o2:  { min: 0.5, max: 2.0 }    # wiki: GAS_WIKI §7.15 — slight increase, vocab: GAS_VOCABULARY §10.4
      nox: { min: 0,   max: 500 }    # wiki: GAS_WIKI §7.15 — slight increase, vocab: GAS_VOCABULARY §10.5 elevated_idle
      lambda: { min: 1.0, max: 2.5 } # wiki: GAS_WIKI §7.15 — > 1.0 (lean)

  # --- §7.16 ---------------------------------------------------------------
