      o2:  { min: 0.0, max: 0.3 }    # wiki: GAS_WIKI §7.16 — slight decrease
      nox: { min: 0,   max: 100 }    # wiki: GAS_WIKI §7.16 — no change / slight decrease
      lambda: { min: 0.97, max: 1.03 }  # wiki: GAS_WIKI §7.16 — ≈ 1.0

