families:
  - id: "P00XX"
    name: "Fuel and Air Metering (VVT, CKP/CMP correlation, sensor reference)"
    citation: "ISO 15031-6 §5.6.1 / SAE J2012 Table D1"
    description: "VVT phaser faults, CKP/CMP correlation, and intake valve carbon buildup attach here."
  - id: "P01XX"
    name: "Fuel and Air Metering (MAF, MAP, IAT, ECT, O2 circuits, trims)"
    citation: "ISO 15031-6 §5.6.1 / SAE J2012 Table D2"
    description: "Vacuum leaks, fuel trim deviations, ECT thermostat faults, and O2 sensor bias/heater faults attach here."
  - id: "P02XX"
    name: "Fuel and Air Metering (Injector circuits, fuel pump, turbo boost)"
    citation: "ISO 15031-6 §5.6.1 / SAE J2012 Table D3"
    description: "Injector electrical circuit errors, fuel pump failures, and turbo/boost performance faults attach here."
  - id: "P03XX"
    name: "Ignition System or Misfire (Misfire, knock sensor, ignition coils)"
    citation: "ISO 15031-6 §5.6.1 / SAE J2012 Table D4"
    description: "Ignition misfires, coil failures, and knock sensor circuit malfunctions attach here."
  - id: "P04XX"
    name: "Auxiliary Emission Controls (Catalyst efficiency, EGR, EVAP)"
    citation: "ISO 15031-6 §5.6.1 / SAE J2012 Table D5"
    description: "Catalyst degradation, EGR flow errors, and EVAP system leaks/purging faults attach here."
  - id: "P05XX"
    name: "Vehicle Speed, Idle Control, and Auxiliary Inputs (Idle air control)"
    citation: "ISO 15031-6 §5.6.1 / SAE J2012 Table D6"
    description: "Idle speed control errors (IAC) and auxiliary input sensor faults attach here."
  - id: "P06XX"
    name: "Computer and Auxiliary Outputs (PCM memory, 5V reference)"
    citation: "ISO 15031-6 §5.6.1 / SAE J2012 Table D7"
    description: "ECU internal checksums, PCM driver circuits, and 5V sensor reference voltage faults attach here."
  - id: "P07XX_P08XX_P09XX"
    name: "Transmission (Transmission control, sensors, clutches)"
    citation: "ISO 15031-6 §5.6.1 / SAE J2012 Table D8/D9/D10"
    description: "TCM communication errors, solenoid failures, and transmission gear ratio faults attach here."
