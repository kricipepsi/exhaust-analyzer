[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "symptomlab"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["pyyaml"]

[tool.setuptools.packages.find]
where = ["."]
include = ["symptomlab*"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
